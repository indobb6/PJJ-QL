<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PJJ Quran Pro</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
    body { font-family: 'Nunito', sans-serif; background-color: #F8FAFC; -webkit-tap-highlight-color: transparent;}
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #10b981; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyz5ghumMQP5SKPeFRimnQou3RAd9UPh3_9VooMjMaeJTe8IKcekzDmx_CLpTgkhBYy/exec"; 

    // Pengganti google.script.run untuk berkomunikasi dengan GAS dari Vercel
    const runApi = async (action, payload = {}) => {
      if(SCRIPT_URL === "URL_APPS_SCRIPT_ANDA_TEMPEL_DISINI") {
        throw new Error("Tolong isi SCRIPT_URL di dalam file index.html terlebih dahulu.");
      }
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          // Menggunakan text/plain agar GAS tidak memblokir masalah CORS Preflight
          body: JSON.stringify({ action, ...payload }), 
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        const result = await response.json();
        if (result.status === 'success') {
          return result.data;
        } else {
          throw new Error(result.message);
        }
      } catch (error) {
        throw error;
      }
    };

    const formatTime = (s) => `${Math.floor(s/60)}:${s%60 < 10 ? '0':''}${s%60}`;

    function App() {
      const [userUid, setUserUid] = useState(null);
      const [role, setRole] = useState(null);
      const [studentData, setStudentData] = useState({ name: '', grade: '1', password: '' });
      const [currentView, setCurrentView] = useState('login');
      const [adminPinInput, setAdminPinInput] = useState('');
      const [toast, setToast] = useState(null);
      const [isLoading, setIsLoading] = useState(false);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const ADMIN_PIN = '123456'; 
      const GRADES = ['1', '2', '3', '4', '5'];
      const DAYS = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'];
      const TASK_TYPES = [
        { id: 'youtube', label: 'Tonton Materi', icon: 'ph-video-camera' },
        { id: 'baca', label: 'Baca Iqro/Quran', icon: 'ph-book-open' },
        { id: 'hafal', label: 'Menghafal', icon: 'ph-microphone-stage' },
        { id: 'murojaah', label: 'Murojaah', icon: 'ph-arrows-clockwise' },
        { id: 'quiz', label: 'Kuis Singkat', icon: 'ph-brain' }
      ];

      const [allTasks, setAllTasks] = useState({});
      const [students, setStudents] = useState([]);
      const [studentProgress, setStudentProgress] = useState({});
      
      const [selectedAdminGrade, setSelectedAdminGrade] = useState('1');
      const [activeTabAdmin, setActiveTabAdmin] = useState('tasks');
      const [adminSelectedStudent, setAdminSelectedStudent] = useState(null);
      const [selectedDay, setSelectedDay] = useState('Senin');
      const [studentReportInput, setStudentReportInput] = useState({ book: '', page: '' });
      const [activeQuizIndex, setActiveQuizIndex] = useState(0);
      const [quizAnswersMap, setQuizAnswersMap] = useState({}); 

      const [isRecording, setIsRecording] = useState(false);
      const [recordingTime, setRecordingTime] = useState(0);
      const [audioBase64, setAudioBase64] = useState(null);
      const [audioMimeType, setAudioMimeType] = useState('');
      
      const [adminRecDay, setAdminRecDay] = useState(null);
      const [adminRecordingTime, setAdminRecordingTime] = useState(0);

      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);
      const timerIntervalRef = useRef(null);
      const micRequestedRef = useRef(false);

      // --- LOGIKA MINTA IZIN MIC ---
      useEffect(() => {
        const initMic = async () => {
          if (micRequestedRef.current) return;
          try {
             const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
             stream.getTracks().forEach(track => track.stop()); 
             micRequestedRef.current = true; 
          } catch(e) {
             console.log("Izin mikrofon tertunda atau ditolak: ", e);
          }
        };
        initMic();
        const handleInteraction = () => {
          initMic(); document.removeEventListener('click', handleInteraction); document.removeEventListener('touchstart', handleInteraction);
        };
        document.addEventListener('click', handleInteraction); document.addEventListener('touchstart', handleInteraction);
        return () => { document.removeEventListener('click', handleInteraction); document.removeEventListener('touchstart', handleInteraction); };
      }, []);

      useEffect(() => {
        const savedRole = localStorage.getItem('role');
        const uid = localStorage.getItem('app_uid');
        if (uid) setUserUid(uid);

        if (savedRole) {
          setRole(savedRole);
          if (savedRole === 'admin') setCurrentView('admin-dashboard');
          else {
            const sName = localStorage.getItem('sName');
            const sGrade = localStorage.getItem('sGrade');
            if (sName) { setStudentData({ name: sName, grade: sGrade || '1', password: '' }); setCurrentView('student-dashboard'); }
          }
        }
      }, []);

      const fetchData = async (isInitialLoad = false) => {
        try {
          const res = await runApi('getInitialData');
          if (role !== 'admin' || isInitialLoad) setAllTasks(res.tasks || {});
          setStudents(res.students || []);
          
          if (role === 'student' && userUid) {
            const myData = res.students.find(s => s.uid === userUid);
            if (myData && myData.progress) setStudentProgress(myData.progress);
          }
          
          setAdminSelectedStudent(prev => {
             if (prev) {
                const updatedSelected = res.students.find(s => s.uid === prev.uid);
                return updatedSelected || prev;
             }
             return prev;
          });
        } catch(e) { showToast(e.message || "Gagal sinkron data.", "error"); }
      };

      useEffect(() => {
        setIsLoading(true);
        fetchData(true).then(() => setIsLoading(false)).catch(() => setIsLoading(false)); 
        
        let interval;
        if (currentView !== 'login') { interval = setInterval(() => fetchData(false), 15000); }
        return () => { if (interval) clearInterval(interval); }
      }, [currentView, role, userUid]);

      useEffect(() => {
        if (role === 'student' && studentData.name && userUid) {
          runApi('updatePresence', { uid: userUid, name: studentData.name, grade: studentData.grade });
        }
      }, [role, studentData.name, currentView]);

      useEffect(() => {
        setActiveQuizIndex(0); setQuizAnswersMap({}); setStudentReportInput({ book: '', page: '' }); setAudioBase64(null);
        if(isRecording) stopRecording();
      }, [selectedDay]);

      useEffect(() => {
        if (isRecording || adminRecDay) {
          timerIntervalRef.current = setInterval(() => {
            if(adminRecDay) setAdminRecordingTime(prev => { if (prev >= 300) { stopAdminRecording(); return 300; } return prev + 1; });
            else setRecordingTime(prev => { if (prev >= 300) { stopRecording(); return 300; } return prev + 1; });
          }, 1000);
        } else clearInterval(timerIntervalRef.current);
        return () => clearInterval(timerIntervalRef.current);
      }, [isRecording, adminRecDay]);


      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mediaRecorder = new MediaRecorder(stream);
          mediaRecorderRef.current = mediaRecorder;
          audioChunksRef.current = [];
          mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunksRef.current.push(e.data); };
          mediaRecorder.onstop = () => {
            const type = mediaRecorder.mimeType || 'audio/webm';
            setAudioMimeType(type);
            const audioBlob = new Blob(audioChunksRef.current, { type });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => setAudioBase64(reader.result);
          };
          mediaRecorder.start();
          setRecordingTime(0); setIsRecording(true);
        } catch (err) { 
          showToast(`Mic Error: ${err.message || err.name}`, "error"); 
        }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current && isRecording) {
          mediaRecorderRef.current.stop();
          mediaRecorderRef.current.stream.getTracks().forEach(track => track.stop());
          setIsRecording(false);
        }
      };

      const startAdminRecording = async (day) => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mediaRecorder = new MediaRecorder(stream);
          mediaRecorderRef.current = mediaRecorder;
          audioChunksRef.current = [];
          mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunksRef.current.push(e.data); };
          mediaRecorder.onstop = () => {
            const type = mediaRecorder.mimeType || 'audio/webm';
            const audioBlob = new Blob(audioChunksRef.current, { type });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              setAllTasks(prev => {
                const ns = {...prev};
                if(!ns[selectedAdminGrade]) ns[selectedAdminGrade] = {};
                if(!ns[selectedAdminGrade][adminRecDay]) ns[selectedAdminGrade][adminRecDay] = {type:'baca'};
                ns[selectedAdminGrade][adminRecDay].teacherAudioBase64 = reader.result;
                ns[selectedAdminGrade][adminRecDay].teacherAudioMimeType = type;
                ns[selectedAdminGrade][adminRecDay].teacherAudioUrl = null; 
                return ns;
              });
              setAdminRecDay(null);
            };
          };
          mediaRecorder.start();
          setAdminRecordingTime(0); setAdminRecDay(day);
        } catch (err) { showToast(`Mic Error: ${err.message || err.name}`, "error"); }
      };

      const stopAdminRecording = () => {
        if (mediaRecorderRef.current && adminRecDay) {
          mediaRecorderRef.current.stop();
          mediaRecorderRef.current.stream.getTracks().forEach(track => track.stop());
        }
      };

      const handleAdminSaveTasks = async () => {
        setIsLoading(true);
        try {
          const updatedTasks = await runApi('saveTasks', { tasksObj: allTasks });
          setAllTasks(updatedTasks); 
          showToast(`Jadwal Kelas ${selectedAdminGrade} tersimpan!`);
        } catch(e) { showToast("Gagal menyimpan.", "error"); }
        setIsLoading(false);
      };

      const handleStudentSubmitTask = async (day, taskData) => {
        let reportText = ''; let finalScore = null;
        if (taskData.type === 'quiz') {
          finalScore = taskData.calculatedScore; reportText = `Mengerjakan Kuis (Nilai: ${finalScore})`;
        } else {
          if (!studentReportInput.book) return showToast("Isi laporanmu dulu!", "error");
          reportText = `${studentReportInput.book} Hal/Ayat: ${studentReportInput.page}`;
        }
        setIsLoading(true);
        try {
          await runApi('submitTask', { uid: userUid, name: studentData.name, day, report: reportText, score: finalScore, audioBase64, mimeType: audioMimeType });
          showToast("Tugas berhasil dikirim!");
          setStudentReportInput({ book: '', page: '' }); setActiveQuizIndex(0); setQuizAnswersMap({}); setAudioBase64(null);
          await fetchData(true);
        } catch(e) { showToast("Gagal mengirim tugas.", "error"); }
        setIsLoading(false);
      };

      const extractVideoID = (url) => {
        if(!url) return null; const m = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/);
        return (m && m[2].length === 11) ? m[2] : null;
      };
      
      const isOnline = (ts) => ts && (new Date().getTime() - ts) < 15 * 60 * 1000;
      const logout = () => { localStorage.removeItem('role'); setRole(null); setAdminPinInput(''); setCurrentView('login'); };

      // --- Components ---
      const ToastMessage = () => {
        if (!toast) return null;
        return (
          <div className="fixed top-5 left-1/2 transform -translate-x-1/2 z-[100] animate-fade-in">
            <div className={`px-6 py-3 rounded-full shadow-xl font-bold flex items-center text-white ${toast.type === 'error' ? 'bg-red-500' : 'bg-emerald-600'}`}>
              <i className={`ph-fill mr-2 text-xl ${toast.type === 'error' ? 'ph-warning-circle' : 'ph-check-circle'}`}></i>{toast.message}
            </div>
          </div>
        );
      };

      const LoadingScreen = () => {
        if (!isLoading) return null;
        return (
          <div className="fixed inset-0 bg-white/60 backdrop-blur-sm z-[90] flex items-center justify-center">
            <div className="bg-white p-5 rounded-2xl shadow-xl flex flex-col items-center"><div className="loader mb-3"></div><p className="text-emerald-700 font-bold text-sm">Menyinkronkan...</p></div>
          </div>
        );
      };

      // ================= VIEWS =================
      const renderLogin = () => {
        const requestMicPermissionFallback = async () => {
          try {
             const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
             stream.getTracks().forEach(track => track.stop());
          } catch(e) {
             showToast("Info: Izin mikrofon blm diberikan. Fitur suara mungkin terkendala.", "error");
          }
        };

        const loginStudent = async () => {
          const { name, password, grade } = studentData;
          if (name && password && grade) {
            const normalizedName = name.trim().toLowerCase();
            const targetUid = 'std_' + btoa(encodeURIComponent(normalizedName + '||' + password));
            
            const existingStudent = students.find(s => s.name.trim().toLowerCase() === normalizedName);
            if (existingStudent && existingStudent.uid !== targetUid) {
              showToast("Nama ini sudah terdaftar dengan password yang berbeda!", "error"); return;
            }
            
            if(!micRequestedRef.current) await requestMicPermissionFallback();
            
            localStorage.setItem('role', 'student'); localStorage.setItem('sName', name); localStorage.setItem('sGrade', grade);
            localStorage.setItem('app_uid', targetUid); setUserUid(targetUid); setRole('student'); setCurrentView('student-dashboard');
          } else { showToast("Isi nama, password, dan kelas dulu ya!", "error"); }
        };

        const loginAdmin = async () => {
          if(adminPinInput === ADMIN_PIN) { 
            if(!micRequestedRef.current) await requestMicPermissionFallback();
            let adminUid = localStorage.getItem('app_uid');
            if(!adminUid) { adminUid = 'admin_' + Date.now(); localStorage.setItem('app_uid', adminUid); setUserUid(adminUid); }
            localStorage.setItem('role', 'admin'); setRole('admin'); setCurrentView('admin-dashboard'); 
          } else { showToast("PIN Salah!", "error"); setAdminPinInput(''); }
        };

        return (
          <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50 p-6 text-center animate-fade-in">
            <div className="bg-emerald-100 p-5 rounded-[2rem] mb-6 shadow-inner border-4 border-white"><i className="ph-fill ph-book-open text-5xl text-emerald-600"></i></div>
            <h1 className="text-3xl font-extrabold text-slate-800 mb-2 tracking-tight">PJJ Quran <span className="text-emerald-500">Pro</span></h1>
            <p className="text-slate-500 mb-8 font-medium">Sistem Pembelajaran Jarak Jauh Al-Quran</p>

            <div className="w-full max-w-sm space-y-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
              <div className="flex justify-center space-x-2 mb-6 bg-slate-100 p-1 rounded-xl">
                <button className={`flex-1 py-2 rounded-lg font-bold text-sm transition-all ${role !== 'admin_login' ? 'bg-white shadow text-emerald-700' : 'text-slate-400'}`} onClick={() => setRole('student')}>Siswa</button>
                <button className={`flex-1 py-2 rounded-lg font-bold text-sm transition-all ${role === 'admin_login' ? 'bg-slate-800 shadow text-white' : 'text-slate-400'}`} onClick={() => setRole('admin_login')}>Guru</button>
              </div>

              {role !== 'admin_login' ? (
                <div className="space-y-4 animate-fade-in text-left">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Nama Lengkap</label>
                    <div className="flex items-center border-2 border-slate-100 rounded-xl px-3 py-3 focus-within:border-emerald-500 bg-slate-50">
                      <i className="ph-fill ph-user text-lg text-slate-400 mr-2"></i>
                      <input type="text" placeholder="Ketik nama..." className="w-full bg-transparent outline-none text-slate-800 font-medium" value={studentData.name} onChange={(e) => setStudentData({...studentData, name: e.target.value})} />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Password</label>
                    <div className="flex items-center border-2 border-slate-100 rounded-xl px-3 py-3 focus-within:border-emerald-500 bg-slate-50">
                      <i className="ph-fill ph-lock-key text-lg text-slate-400 mr-2"></i>
                      <input type="password" placeholder="Buat / Masukkan password..." className="w-full bg-transparent outline-none text-slate-800 font-medium" value={studentData.password} onChange={(e) => setStudentData({...studentData, password: e.target.value})} />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Kelas</label>
                    <select className="w-full border-2 border-slate-100 rounded-xl px-4 py-3 bg-slate-50 outline-none focus:border-emerald-500 text-slate-800 font-medium" value={studentData.grade} onChange={(e) => setStudentData({...studentData, grade: e.target.value})}>
                      {GRADES.map(g => <option key={g} value={g}>Kelas {g}</option>)}
                    </select>
                  </div>
                  <button onClick={loginStudent} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-1 mt-4">Masuk / Daftar!</button>
                </div>
              ) : (
                <div className="space-y-4 animate-fade-in text-left">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">PIN Guru</label>
                    <div className="flex items-center border-2 border-slate-100 rounded-xl px-3 py-3 focus-within:border-slate-800 bg-slate-50">
                      <i className="ph-fill ph-lock-key text-lg text-slate-400 mr-2"></i>
                      <input type="password" placeholder="***" className="w-full bg-transparent outline-none text-slate-800 font-bold tracking-widest" value={adminPinInput} onChange={(e) => setAdminPinInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && loginAdmin()} />
                    </div>
                  </div>
                  <button onClick={loginAdmin} className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg transition-all mt-2">Masuk Panel</button>
                </div>
              )}
            </div>
          </div>
        );
      };

      const renderAdminDashboard = () => {
        const updateTaskData = (day, field, value) => {
          setAllTasks(prev => {
            const newState = { ...prev };
            if (!newState[selectedAdminGrade]) newState[selectedAdminGrade] = {};
            if (!newState[selectedAdminGrade][day]) newState[selectedAdminGrade][day] = { type: 'baca', desc: '', questions: [] };
            if(field === 'type' && value === 'quiz') {
              if(!newState[selectedAdminGrade][day].questions?.length) newState[selectedAdminGrade][day].questions = [{ q: '', opts: ['', '', ''], ans: '' }];
            }
            newState[selectedAdminGrade][day] = { ...newState[selectedAdminGrade][day], [field]: value };
            return newState;
          });
        };

        const updateQuizQ = (day, qIdx, field, value) => {
          setAllTasks(prev => {
            const newState = { ...prev }; const qList = [...(newState[selectedAdminGrade][day].questions || [])];
            if (field === 'opts') qList[qIdx].opts[value.idx] = value.val; else qList[qIdx][field] = value;
            newState[selectedAdminGrade][day].questions = qList; return newState;
          });
        };

        const currentGradeTasks = allTasks[selectedAdminGrade] || {};

        return (
          <div className="min-h-screen bg-slate-100 pb-10">
            <header className="bg-slate-900 text-white p-4 sticky top-0 z-20 shadow-lg">
              <div className="max-w-4xl mx-auto flex justify-between items-center">
                <div className="flex items-center"><i className="ph-fill ph-gear text-2xl text-emerald-400 mr-2"></i><h1 className="font-bold text-lg">Panel Guru</h1></div>
                <button onClick={logout} className="text-slate-400 hover:text-white flex items-center text-sm font-medium bg-slate-800 px-3 py-1.5 rounded-lg">Keluar <i className="ph-bold ph-sign-out ml-2"></i></button>
              </div>
            </header>

            <div className="max-w-4xl mx-auto p-4 mt-4 animate-fade-in">
              <div className="flex space-x-2 mb-6 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200">
                <button className={`flex-1 py-2.5 rounded-xl font-bold flex justify-center items-center text-sm transition-all ${activeTabAdmin === 'tasks' ? 'bg-slate-900 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`} onClick={() => setActiveTabAdmin('tasks')}><i className="ph-bold ph-calendar-blank mr-2 text-lg"></i> Atur Tugas</button>
                <button className={`flex-1 py-2.5 rounded-xl font-bold flex justify-center items-center text-sm transition-all ${activeTabAdmin === 'students' ? 'bg-slate-900 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`} onClick={() => setActiveTabAdmin('students')}><i className="ph-bold ph-users mr-2 text-lg"></i> Pantau Siswa</button>
              </div>

              {activeTabAdmin === 'tasks' ? (
                <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
                  <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-6 pb-4 border-b border-slate-100">
                    <div><h2 className="text-xl font-extrabold text-slate-800">Materi & Tugas</h2><p className="text-slate-500 text-sm">Pilih kelas untuk diatur.</p></div>
                    <select className="mt-4 sm:mt-0 bg-emerald-50 border-2 border-emerald-100 text-emerald-800 font-bold rounded-xl px-4 py-2 outline-none cursor-pointer" value={selectedAdminGrade} onChange={(e) => setSelectedAdminGrade(e.target.value)}>
                      {GRADES.map(g => <option key={g} value={g}>Target: Kelas {g}</option>)}
                    </select>
                  </div>
                  
                  <div className="space-y-6">
                    {DAYS.map(day => {
                      const task = currentGradeTasks[day] || { type: 'baca', desc: '', questions: [] };
                      const isRecThisDay = adminRecDay === day;
                      
                      return (
                        <div key={day} className="border-2 border-slate-100 rounded-2xl p-5 bg-slate-50/50 hover:border-slate-200 transition-colors">
                          <div className="flex flex-col xl:flex-row xl:justify-between xl:items-center mb-4">
                            <h3 className="font-bold text-slate-800 flex items-center mb-3 xl:mb-0"><span className="w-8 h-8 bg-white shadow-sm border border-slate-200 rounded-lg flex items-center justify-center mr-3 text-emerald-600">{day.charAt(0)}</span> Hari {day}</h3>
                            <div className="flex flex-wrap bg-white rounded-lg p-1 border shadow-sm gap-1">
                              {TASK_TYPES.map(t => (
                                <button key={t.id} onClick={() => updateTaskData(day, 'type', t.id)} className={`flex items-center px-3 py-1.5 rounded-md text-xs font-bold transition-colors ${task.type === t.id ? 'bg-slate-800 text-white' : 'text-slate-500 hover:bg-slate-100'}`}><i className={`${t.icon} mr-1.5 text-sm`}></i> {t.label}</button>
                              ))}
                            </div>
                          </div>

                          <div className="bg-white p-4 rounded-xl border border-slate-100 shadow-sm space-y-3">
                            {task.type === 'youtube' && (
                              <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">Link YouTube</label><input type="text" placeholder="https://youtube.com/watch?v=..." className="w-full border-2 border-slate-100 rounded-lg px-3 py-2 text-sm focus:border-emerald-500 outline-none" value={task.url || ''} onChange={(e) => updateTaskData(day, 'url', e.target.value)} /></div>
                            )}

                            {task.type === 'quiz' && (
                              <div className="space-y-4">
                                {(task.questions || []).map((q, idx) => (
                                  <div key={idx} className="bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                                    <div className="flex justify-between items-center mb-2"><span className="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-1 rounded">SOAL {idx+1}</span></div>
                                    <input type="text" placeholder="Pertanyaan..." className="w-full border border-blue-200 rounded-lg px-3 py-2 text-sm mb-2 outline-none font-bold text-slate-700" value={q.q} onChange={(e) => updateQuizQ(day, idx, 'q', e.target.value)} />
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-2">
                                      {[0,1,2].map(optIdx => (
                                        <input key={optIdx} type="text" placeholder={`Opsi ${optIdx+1}`} className="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-sm outline-none" value={q.opts?.[optIdx] || ''} onChange={(e) => updateQuizQ(day, idx, 'opts', {idx: optIdx, val: e.target.value})} />
                                      ))}
                                    </div>
                                    <select className="w-full border border-emerald-200 bg-emerald-50 text-emerald-800 font-bold rounded-lg px-2 py-1.5 text-sm outline-none" value={q.ans || ''} onChange={(e) => updateQuizQ(day, idx, 'ans', e.target.value)}>
                                      <option value="">Pilih jawaban benar...</option>
                                      {q.opts?.map((opt, i) => opt && <option key={i} value={opt}>{opt}</option>)}
                                    </select>
                                  </div>
                                ))}
                              </div>
                            )}

                            <div><label className="block text-xs font-bold text-slate-500 uppercase mt-2 mb-1">Instruksi Guru / Pesan</label><textarea rows="2" placeholder="Tulis instruksi untuk siswa..." className="w-full border-2 border-slate-100 rounded-lg px-3 py-2 text-sm focus:border-emerald-500 outline-none resize-none" value={task.desc || ''} onChange={(e) => updateTaskData(day, 'desc', e.target.value)} /></div>
                            
                            {/* Modul Rekaman Suara Guru */}
                            <div className="border-t border-slate-100 pt-3 mt-3">
                              <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Arahan Suara Doa/Hadits (Opsional)</label>
                              
                              {(task.teacherAudioUrl || task.teacherAudioBase64) && !isRecThisDay ? (
                                <div className="flex items-center space-x-3 bg-emerald-50 p-2 rounded-xl border border-emerald-200">
                                  <audio controls className="h-10 flex-1 outline-none" src={task.teacherAudioBase64 || task.teacherAudioUrl}></audio>
                                  <button onClick={() => { updateTaskData(day, 'teacherAudioUrl', null); updateTaskData(day, 'teacherAudioBase64', null); }} className="text-red-500 hover:bg-red-100 p-2 rounded-lg" title="Hapus"><i className="ph-bold ph-trash"></i></button>
                                </div>
                              ) : isRecThisDay ? (
                                <div className="flex items-center space-x-3 bg-red-50 border border-red-200 p-2 rounded-xl">
                                  <div className="text-red-500 font-bold flex-1 flex items-center px-2 animate-pulse"><i className="ph-fill ph-record mr-2"></i> {formatTime(adminRecordingTime)} / 5:00</div>
                                  <button onClick={stopAdminRecording} className="bg-red-500 text-white font-bold py-2 px-4 rounded-lg text-sm hover:bg-red-600">Stop</button>
                                </div>
                              ) : (
                                <button onClick={() => startAdminRecording(day)} disabled={adminRecDay !== null} className={`flex items-center justify-center w-full py-2.5 rounded-xl border-2 border-dashed font-bold text-sm transition-colors ${adminRecDay !== null ? 'border-slate-200 text-slate-300' : 'border-emerald-300 text-emerald-600 hover:bg-emerald-50'}`}>
                                  <i className="ph-bold ph-microphone mr-2 text-lg"></i> Rekam Arahan (Maks 5 Menit)
                                </button>
                              )}
                            </div>
                            
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  
                  <div className="sticky bottom-4 mt-6">
                    <button onClick={handleAdminSaveTasks} className="w-full bg-slate-900 hover:bg-black text-white font-bold py-4 rounded-2xl shadow-xl transition-all flex items-center justify-center"><i className="ph-fill ph-check-circle mr-2 text-xl text-emerald-400"></i> Simpan Jadwal Kelas {selectedAdminGrade}</button>
                  </div>
                </div>
              ) : (
                <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
                  <div className="flex justify-between items-center mb-6">
                    <h2 className="text-xl font-extrabold text-slate-800">Status Siswa</h2>
                    <div className="flex items-center bg-green-50 px-3 py-1 rounded-full border border-green-100 text-xs font-bold text-green-700"><i className="ph-fill ph-pulse mr-1.5 animate-pulse"></i> Realtime</div>
                  </div>
                  
                  <div className="flex space-x-2 mb-4 overflow-x-auto pb-2 scrollbar-hide">
                    <button onClick={() => setSelectedAdminGrade('All')} className={`px-4 py-1.5 rounded-full text-xs font-bold border transition-colors ${selectedAdminGrade === 'All' ? 'bg-slate-800 text-white' : 'bg-white text-slate-600'}`}>Semua</button>
                    {GRADES.map(g => <button key={g} onClick={() => setSelectedAdminGrade(g)} className={`px-4 py-1.5 rounded-full text-xs font-bold border transition-colors ${selectedAdminGrade === g ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-white text-slate-600'}`}>Kelas {g}</button>)}
                  </div>

                  <div className="overflow-x-auto rounded-xl border border-slate-200">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                          <th className="p-4 font-bold">Nama</th>
                          <th className="p-4 font-bold text-center">Kls</th>
                          <th className="p-4 font-bold text-center">Status</th>
                          <th className="p-4 font-bold text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="text-sm">
                        {students.filter(s => selectedAdminGrade === 'All' || s.grade == selectedAdminGrade).map(student => {
                          const online = isOnline(student.lastActive);
                          return (
                            <tr key={student.uid} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                              <td className="p-4 font-bold text-slate-800">{student.name}</td>
                              <td className="p-4 text-center font-bold text-slate-500">{student.grade}</td>
                              <td className="p-4 text-center">{online ? <span className="bg-green-100 text-green-700 px-2.5 py-1 rounded-full text-[10px] font-bold">Online</span> : <span className="bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full text-[10px] font-bold">Offline</span>}</td>
                              <td className="p-4 text-center"><button onClick={() => setAdminSelectedStudent(student)} className="bg-emerald-100 text-emerald-700 font-bold px-3 py-1.5 rounded-lg text-xs hover:bg-emerald-200 transition-colors"><i className="ph-bold ph-folder-open mr-1"></i> Buka</button></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* MODAL LAPORAN SISWA - FIX AUDIO FALLBACK BUTTON */}
              {adminSelectedStudent && (
                <div className="fixed inset-0 bg-slate-900/60 z-[80] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" onClick={() => setAdminSelectedStudent(null)}>
                  <div className="bg-white rounded-[2rem] w-full max-w-lg max-h-[85vh] overflow-y-auto relative shadow-2xl" onClick={(e) => e.stopPropagation()}>
                    <div className="sticky top-0 bg-white/90 backdrop-blur border-b border-slate-100 px-6 py-4 flex justify-between items-center z-10">
                      <div><h2 className="text-xl font-extrabold text-slate-800">{adminSelectedStudent.name}</h2><p className="text-emerald-600 text-sm font-bold">Kelas {adminSelectedStudent.grade}</p></div>
                      <button onClick={() => setAdminSelectedStudent(null)} className="p-2 bg-slate-100 rounded-full text-slate-500 hover:bg-red-100 hover:text-red-500 transition-colors"><i className="ph-bold ph-x text-lg"></i></button>
                    </div>

                    <div className="p-6 space-y-4">
                      {DAYS.map(day => {
                        const prog = adminSelectedStudent.progress?.[day];
                        return (
                          <div key={day} className="border-2 border-slate-100 rounded-2xl p-4 bg-slate-50">
                            <h4 className="font-bold text-slate-700 mb-2 flex items-center"><div className="w-2 h-2 rounded-full bg-emerald-400 mr-2"></div> Hari {day}</h4>
                            {prog ? (
                              <div className="space-y-3">
                                <p className="text-sm font-medium text-slate-600 bg-white p-3 rounded-xl border border-slate-200">{prog.report}</p>
                                {prog.audioData && prog.audioData !== "error_upload" && (
                                  <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl flex flex-col space-y-2">
                                    <span className="text-[10px] font-bold text-emerald-600 uppercase flex items-center justify-between">
                                      <span><i className="ph-fill ph-headphones mr-1"></i> Rekaman Siswa</span>
                                      <a href={prog.audioData} target="_blank" className="text-blue-500 hover:underline">Buka Audio <i className="ph-bold ph-arrow-square-out"></i></a>
                                    </span>
                                    <audio controls className="w-full h-10 outline-none rounded-lg" src={prog.audioData}></audio>
                                  </div>
                                )}
                              </div>
                            ) : (<p className="text-sm text-slate-400 font-medium italic p-2 bg-white rounded-xl border border-dashed border-slate-200 text-center">Belum dikerjakan</p>)}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      };

      const renderStudentDashboard = () => {
        const myClassTasks = allTasks[studentData.grade] || {};
        const todayTask = myClassTasks[selectedDay];
        const isCompleted = studentProgress[selectedDay]?.completed;
        const reportText = studentProgress[selectedDay]?.report;
        const isAudioTask = todayTask?.type === 'baca' || todayTask?.type === 'hafal' || todayTask?.type === 'murojaah';

        const submitKuis = () => {
          let c = 0; todayTask.questions.forEach((q, i) => { if (quizAnswersMap[i] === q.ans) c++; });
          const sc = Math.round((c / todayTask.questions.length) * 100);
          handleStudentSubmitTask(selectedDay, { ...todayTask, calculatedScore: sc });
        };

        const iconClass = TASK_TYPES.find(t => t.id === todayTask?.type)?.icon || 'ph-calendar-blank';
        const labelText = TASK_TYPES.find(t => t.id === todayTask?.type)?.label || 'Belum ada tugas';

        return (
          <div className="min-h-screen bg-[#F0FDF4] pb-20">
            <header className="bg-white px-5 py-4 shadow-sm rounded-b-[2rem] sticky top-0 z-10 border-b border-emerald-50">
              <div className="max-w-md mx-auto flex justify-between items-center">
                <div className="flex items-center">
                  <div className="w-10 h-10 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-600 font-bold mr-3 border-2 border-emerald-200 text-lg uppercase">{studentData.name.charAt(0)}</div>
                  <div><h1 className="font-extrabold text-slate-800 leading-tight truncate max-w-[150px]">{studentData.name}</h1><p className="text-xs font-bold text-emerald-600">Kelas {studentData.grade}</p></div>
                </div>
                <button onClick={logout} className="p-2.5 bg-slate-50 text-slate-400 rounded-full hover:bg-red-50 hover:text-red-500 transition-colors"><i className="ph-bold ph-sign-out text-lg"></i></button>
              </div>
            </header>

            <div className="max-w-md mx-auto p-5 mt-2 animate-fade-in">
              <div className="flex space-x-3 overflow-x-auto pb-4 pt-1 scrollbar-hide px-1">
                {DAYS.map(day => {
                  const isDone = studentProgress[day]?.completed;
                  const isSel = selectedDay === day;
                  return (
                    <button key={day} onClick={() => setSelectedDay(day)} className={`min-w-[72px] py-3.5 rounded-2xl flex flex-col items-center justify-center transition-all flex-shrink-0 border-2 ${isSel ? 'bg-emerald-600 border-emerald-600 text-white shadow-lg transform scale-105' : 'bg-white border-transparent text-slate-500'}`}>
                      <span className={`text-[11px] font-bold uppercase tracking-wider mb-1.5 opacity-80 ${isSel ? 'text-emerald-100' : ''}`}>{day.slice(0,3)}</span>
                      {isDone ? <i className={`ph-fill ph-check-circle text-xl ${isSel ? 'text-white' : 'text-emerald-500'}`}></i> : <div className={`w-5 h-5 rounded-full border-2 ${isSel ? 'border-emerald-300' : 'border-slate-200'}`}></div>}
                    </button>
                  );
                })}
              </div>

              <div className="mt-4 bg-white rounded-[2rem] p-6 shadow-sm border border-emerald-100 relative overflow-hidden">
                {isCompleted && <div className="absolute top-0 right-0 bg-emerald-500 text-white text-[10px] font-bold px-4 py-1.5 rounded-bl-2xl z-10 tracking-widest uppercase shadow-sm">Selesai</div>}
                
                <div className="flex items-center mb-5">
                  <div className={`p-2.5 rounded-xl mr-3 ${isCompleted ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'}`}><i className={`ph-fill ${iconClass} text-2xl`}></i></div>
                  <div><h2 className="text-xl font-extrabold text-slate-800 leading-none mb-1">Hari {selectedDay}</h2><p className="text-xs font-bold text-slate-400 uppercase tracking-wide">{labelText}</p></div>
                </div>

                {todayTask && (todayTask.desc || todayTask.url || todayTask.teacherAudioUrl || (todayTask.type === 'quiz' && todayTask.questions?.length) || isAudioTask) ? (
                  <div className="space-y-5">
                    
                    {/* Pemutar Suara Arahan Guru - FIX BUG RENDER */}
                    {todayTask.teacherAudioUrl && (
                      <div className="bg-emerald-100 border border-emerald-200 rounded-2xl p-4 flex flex-col space-y-2">
                         <span className="font-bold text-emerald-800 flex items-center justify-between">
                           <span><i className="ph-fill ph-speaker-high mr-2 text-xl"></i> Arahan Suara Guru:</span>
                           <a href={todayTask.teacherAudioUrl} target="_blank" className="text-xs text-blue-600 hover:underline">Buka Audio <i className="ph-bold ph-arrow-square-out"></i></a>
                         </span>
                         <audio src={todayTask.teacherAudioUrl} controls className="w-full h-10 outline-none rounded-lg"></audio>
                      </div>
                    )}

                    {todayTask.desc && (
                      <div className="bg-slate-50 border border-slate-100 rounded-2xl p-4 text-slate-700 text-sm leading-relaxed font-medium"><span className="font-bold text-emerald-600 block mb-1">📝 Pesan Guru:</span>{todayTask.desc}</div>
                    )}
                    
                    {todayTask.type === 'youtube' && todayTask.url && (
                      <div className="aspect-video bg-slate-900 rounded-2xl overflow-hidden shadow-inner border-4 border-slate-100">
                        {extractVideoID(todayTask.url) ? <iframe className="w-full h-full" src={`https://www.youtube.com/embed/${extractVideoID(todayTask.url)}`} frameBorder="0" allowFullScreen></iframe> : <div className="flex flex-col items-center justify-center h-full text-slate-500 bg-slate-100"><i className="ph-fill ph-video-camera text-3xl mb-2 opacity-50"></i><p className="text-xs font-bold">Link video tidak valid</p></div>}
                      </div>
                    )}

                    {!isCompleted ? (
                      <div className="pt-2 border-t border-slate-100">
                        {todayTask.type === 'quiz' ? (
                          <div className="space-y-4 animate-fade-in" key={activeQuizIndex}>
                            <div className="flex justify-between items-center mb-1">
                              <span className="text-xs font-bold text-blue-500 uppercase tracking-wider">Soal {activeQuizIndex + 1}/{todayTask.questions.length}</span>
                              <div className="flex space-x-1">{todayTask.questions.map((_, i) => <div key={i} className={`w-2 h-2 rounded-full ${i===activeQuizIndex?'bg-blue-500 w-4':i<activeQuizIndex?'bg-blue-200':'bg-slate-200'} transition-all`}></div>)}</div>
                            </div>
                            <h3 className="font-bold text-slate-800 text-lg mb-4">{todayTask.questions[activeQuizIndex].q}</h3>
                            <div className="space-y-2">
                              {todayTask.questions[activeQuizIndex].opts.filter(o=>o).map((opt, i) => {
                                const sel = quizAnswersMap[activeQuizIndex] === opt;
                                return <button key={i} onClick={() => setQuizAnswersMap({...quizAnswersMap, [activeQuizIndex]: opt})} className={`w-full text-left p-4 rounded-xl border-2 font-bold transition-all flex justify-between items-center ${sel ? 'bg-blue-50 border-blue-500 text-blue-700' : 'bg-white border-slate-200 text-slate-600 hover:border-blue-200'}`}><span>{opt}</span>{sel && <div className="w-3 h-3 bg-blue-500 rounded-full"></div>}</button>
                              })}
                            </div>
                            <button onClick={() => activeQuizIndex < todayTask.questions.length - 1 ? setActiveQuizIndex(a=>a+1) : submitKuis()} disabled={!quizAnswersMap[activeQuizIndex]} className={`w-full py-4 rounded-xl font-bold text-white transition-all flex justify-center items-center mt-6 ${quizAnswersMap[activeQuizIndex] ? 'bg-blue-600 shadow-lg' : 'bg-slate-200 text-slate-400'}`}>
                              {activeQuizIndex < todayTask.questions.length - 1 ? <>Selanjutnya <i className="ph-bold ph-caret-right ml-1"></i></> : 'Simpan Nilai'}
                            </button>
                          </div>
                        ) : (
                          <div className="space-y-4">
                            {isAudioTask && (
                              <div className="bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-4 text-center">
                                {!audioBase64 ? (
                                  <>
                                    <h3 className="font-bold text-slate-700 text-sm mb-3">{isRecording ? "Merekam suaramu..." : "Rekam Suara (Maks 5 Menit)"}</h3>
                                    {isRecording ? (
                                      <div className="flex flex-col items-center">
                                        <div className="text-3xl font-black text-red-500 mb-3 animate-pulse">{formatTime(recordingTime)}</div>
                                        <button onClick={stopRecording} className="bg-red-50 text-red-600 border border-red-200 font-bold py-2.5 px-6 rounded-xl flex items-center"><i className="ph-fill ph-stop-circle mr-2 text-xl"></i> Stop Rekam</button>
                                      </div>
                                    ) : (
                                      <button onClick={startRecording} className="bg-emerald-50 text-emerald-600 border border-emerald-200 font-bold py-3 px-6 rounded-xl flex items-center mx-auto hover:bg-emerald-100 hover:scale-105 transition-all"><i className="ph-fill ph-microphone mr-2 text-xl"></i> Mulai Rekam</button>
                                    )}
                                  </>
                                ) : (
                                  <div className="flex flex-col items-center">
                                    <h3 className="font-bold text-emerald-700 text-sm mb-2 flex items-center"><i className="ph-fill ph-check-circle mr-1"></i> Rekaman Siap Dikirim</h3>
                                    <audio src={audioBase64} controls className="w-full h-10 mb-3"></audio>
                                    <button onClick={() => setAudioBase64(null)} className="text-xs text-slate-400 hover:text-red-500 font-bold underline">Hapus & Rekam Ulang</button>
                                  </div>
                                )}
                              </div>
                            )}
                            <div>
                              <h3 className="font-bold text-emerald-700 text-sm mb-2 mt-4">Ketik Laporan:</h3>
                              <input type="text" placeholder={todayTask.type==='hafal'?"Surah apa?":"Iqro/Surah apa?"} className="w-full border-2 border-slate-100 rounded-xl px-4 py-3 mb-3 text-sm font-medium focus:border-emerald-500 outline-none bg-slate-50" value={studentReportInput.book} onChange={e=>setStudentReportInput({...studentReportInput, book: e.target.value})} />
                              <input type="text" placeholder="Halaman / Ayat?" className="w-full border-2 border-slate-100 rounded-xl px-4 py-3 text-sm font-medium focus:border-emerald-500 outline-none bg-slate-50" value={studentReportInput.page} onChange={e=>setStudentReportInput({...studentReportInput, page: e.target.value})} />
                            </div>
                            <button onClick={() => handleStudentSubmitTask(selectedDay, todayTask)} disabled={!studentReportInput.book} className={`w-full py-4 rounded-xl font-bold text-white transition-all mt-2 ${studentReportInput.book ? 'bg-emerald-500 hover:bg-emerald-600 shadow-lg' : 'bg-slate-200 text-slate-400'}`}>Kirim Tugas {audioBase64?'& Rekaman':''}</button>
                          </div>
                        )}
                      </div>
                    ) : (
                      <div className="bg-emerald-50 rounded-2xl p-6 text-center border-2 border-emerald-100 mt-4">
                        <i className="ph-fill ph-check-circle text-5xl text-emerald-500 mx-auto mb-3"></i>
                        <p className="font-extrabold text-emerald-800 text-lg">Alhamdulillah!</p>
                        <p className="text-sm text-emerald-600 font-medium mb-1">{reportText}</p>
                        {studentProgress[selectedDay]?.audioData && studentProgress[selectedDay]?.audioData !== "error_upload" && <p className="text-xs text-emerald-500 font-bold flex justify-center items-center mt-2"><i className="ph-fill ph-microphone mr-1"></i> Audio terkirim</p>}
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="text-center py-10">
                    <div className="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4"><i className="ph-fill ph-calendar-blank text-3xl text-slate-300"></i></div>
                    <p className="text-slate-500 font-bold">Belum ada tugas.</p>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      return (
        <React.Fragment>
          <ToastMessage />
          <LoadingScreen />
          {currentView === 'login' && renderLogin()}
          {currentView === 'admin-dashboard' && renderAdminDashboard()}
          {currentView === 'student-dashboard' && renderStudentDashboard()}
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
